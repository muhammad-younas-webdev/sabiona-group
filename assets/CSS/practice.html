<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ul {
        list-style: none;
      }

      .header {
        background: #222;
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .container {
        width: min(1200px, 90%);
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 70px;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
      }

      .nav-list {
        display: flex;
        gap: 40px;
      }

      .nav-list a {
        color: #fff;
        transition: 0.3s;
      }

      .nav-list a:hover {
        color: #00bfff;
      }

      /* Hamburger */

      .hamburger {
        display: none;
        width: 32px;
        height: 24px;
        background: none;
        border: none;
        cursor: pointer;
        position: relative;
        z-index: 1002;
      }

      .hamburger span {
        position: absolute;
        left: 0;
        width: 100%;
        height: 3px;
        background: #fff;
        border-radius: 50px;
        transition: 0.3s ease;
      }

      .hamburger span:nth-child(1) {
        top: 0;
      }

      .hamburger span:nth-child(2) {
        top: 50%;
        transform: translateY(-50%);
      }

      .hamburger span:nth-child(3) {
        bottom: 0;
      }

      /* Cross */

      .hamburger.active span:nth-child(1) {
        top: 50%;
        transform: translateY(-50%) rotate(45deg);
      }

      .hamburger.active span:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active span:nth-child(3) {
        top: 50%;
        bottom: auto;
        transform: translateY(-50%) rotate(-45deg);
      }

      /* Overlay */

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: 0.3s;
        z-index: 998;
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* Mobile */

      @media (max-width: 768px) {
        .hamburger {
          display: block;
        }

        .navbar {
          position: fixed;
          top: 0;
          right: -100%;
          width: 280px;
          height: 100vh;
          background: #333;
          padding-top: 90px;
          transition: 0.35s;
          z-index: 999;
        }

        .navbar.active {
          right: 0;
        }

        .nav-list {
          flex-direction: column;
          gap: 30px;
          padding-left: 30px;
        }
      }

      /* Demo Content */

      .hero {
        height: 150vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div class="overlay"></div>

    <header class="header">
      <div class="container">
        <div class="logo">LOGO</div>

        <nav class="navbar">
          <ul class="nav-list">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>

        <button class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <section class="hero"> Responsive Navbar Demo </section>

    <script>
      const hamburger = document.querySelector(".hamburger");
      const navbar = document.querySelector(".navbar");
      const overlay = document.querySelector(".overlay");

      function closeMenu() {
        hamburger.classList.remove("active");
        navbar.classList.remove("active");
        overlay.classList.remove("active");
      }

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("active");
        navbar.classList.toggle("active");
        overlay.classList.toggle("active");
      });

      overlay.addEventListener("click", closeMenu);

      window.addEventListener("resize", () => {
        if (window.innerWidth > 768) {
          closeMenu();
        }
      });
    </script>
  </body>
</html>
