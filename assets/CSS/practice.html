<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Hero Section</title>

    <style>
      /* ===========================
   RESET
=========================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
      }

      /* ===========================
   CONTAINER
=========================== */
      .container {
        width: 100%;
        max-width: 1320px;
        margin: auto;
        padding: 0 20px;
      }

      /* ===========================
   HEADER
=========================== */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 100;
      }

      .header-container {
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 30px;
        font-weight: bold;
        color: #fff;
        letter-spacing: 2px;
      }

      .nav {
        display: flex;
        gap: 40px;
      }

      .nav a {
        text-decoration: none;
        color: #d3d3d3;
        transition: 0.3s;
      }

      .nav a:hover {
        color: #fff;
      }

      /* ===========================
   HERO SECTION
=========================== */

      .hero-section {
        position: relative;
        overflow: hidden;

        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          url("https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1800&q=80");

        background-size: cover;
        background-position: center;

        min-height: 100vh;

        display: flex;
        align-items: center;
      }

      /* ===========================
   TOP GRADIENT
=========================== */

      .hero-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 180px;

        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.95),
          rgba(35, 35, 35, 0.75),
          transparent
        );

        z-index: 1;
      }

      /* ===========================
   LEFT TO RIGHT GRADIENT
=========================== */

      .hero-section::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50%;

        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.95),
          rgba(30, 30, 30, 0.75),
          rgba(70, 70, 70, 0.3),
          transparent
        );

        z-index: 1;
      }

      /* ===========================
   HERO CONTAINER
=========================== */

      .hero-container {
        position: relative;
        z-index: 5;

        max-width: 650px;
        padding-top: 90px;
      }

      .hero-subtitle {
        color: #bfbfbf;
        font-size: 18px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 15px;
      }

      .hero-title {
        font-size: 68px;
        line-height: 1.05;
        font-weight: 700;
        margin-bottom: 25px;
      }

      .hero-text {
        color: #cfcfcf;
        line-height: 1.8;
        font-size: 18px;
        margin-bottom: 35px;
      }

      .hero-btn {
        display: inline-block;
        padding: 16px 40px;
        border: 1px solid #777;
        text-decoration: none;
        color: #fff;
        transition: 0.3s;
      }

      .hero-btn:hover {
        background: #fff;
        color: #000;
      }

      /* ===========================
   RESPONSIVE
=========================== */

      @media (max-width: 768px) {
        .hero-title {
          font-size: 46px;
        }

        .hero-text {
          font-size: 16px;
        }

        .nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- =========================
     HEADER
========================== -->

    <header class="header">
      <div class="container">
        <div class="header-container">
          <div class="logo">SABIONA</div>

          <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- =========================
     HERO SECTION
========================== -->

    <section class="hero-section">
      <div class="container">
        <div class="hero-container">
          <p class="hero-subtitle"> BRIDGING MARKETS. </p>

          <h1 class="hero-title">
            BUILDING <br />
            VALUE.
          </h1>

          <p class="hero-text">
            We connect businesses with opportunities through innovative
            solutions, strategic partnerships and long-term sustainable growth.
          </p>

          <a href="#" class="hero-btn"> Learn More </a>
        </div>
      </div>
    </section>
  </body>
</html>
