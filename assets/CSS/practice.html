<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CTA Grid Section</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #0d1117;
        padding: 60px;
      }

      /* Container */

      .container {
        width: min(1200px, 100%);
        margin: auto;
      }

      /* CTA Section */

      .cta-section {
        position: relative;
        overflow: hidden;

        padding: 55px 60px;

        background:
          linear-gradient(rgba(13, 18, 27, 0.82), rgba(13, 18, 27, 0.82)),
          url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1600");

        background-size: cover;
        background-position: center;

        border-radius: 10px;
      }

      /* Grid */

      .cta-grid {
        display: grid;

        grid-template-columns:
          max-content
          minmax(0, 530px)
          max-content;

        align-items: center;

        justify-content: space-between;

        gap: 60px;
      }

      /* Left */

      .cta-title {
        color: #fff;

        font-size: 40px;

        font-weight: 300;

        letter-spacing: 2px;

        line-height: 1.25;

        white-space: nowrap;
      }

      /* Center */

      .cta-desc {
        color: #9ea5af;

        font-size: 15px;

        line-height: 1.8;
      }

      /* Right */

      .cta-btn {
        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        text-decoration: none;

        color: #fff;

        border: 1px solid rgba(255, 255, 255, 0.25);

        padding: 16px 28px;

        transition: 0.35s;

        white-space: nowrap;
      }

      .cta-btn:hover {
        background: #fff;

        color: #111;
      }

      /* Tablet */

      @media (max-width: 991px) {
        .cta-grid {
          grid-template-columns: 1fr;

          gap: 35px;

          text-align: center;
        }

        .cta-title {
          white-space: normal;

          font-size: 34px;
        }

        .cta-desc {
          max-width: 530px;

          margin: auto;
        }

        .cta-btn {
          justify-self: center;
        }
      }

      /* Mobile */

      @media (max-width: 576px) {
        body {
          padding: 20px;
        }

        .cta-section {
          padding: 40px 25px;
        }

        .cta-title {
          font-size: 28px;

          letter-spacing: 1px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <section class="cta-section">
        <div class="cta-grid">
          <div class="cta-left">
            <h2 class="cta-title">
              LET'S BUILD<br />
              THE FUTURE TOGETHER.
            </h2>
          </div>

          <div class="cta-center">
            <p class="cta-desc">
              We are always looking for ambitious entrepreneurs and management
              teams to create lasting value together. Reach out to our teams in
              Munich or Brixen.
            </p>
          </div>

          <div class="cta-right">
            <a href="#" class="cta-btn"> CONTACT US → </a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
